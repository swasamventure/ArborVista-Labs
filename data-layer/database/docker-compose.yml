services:
  database:
    build:
      context: .
      dockerfile: deploy/Dockerfile.database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbor_vista}
      POSTGRES_USER: ${POSTGRES_USER:-arbor_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - arbor_vista_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbor_app} -d ${POSTGRES_DB:-arbor_vista}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  arbor_vista_postgres:
